name: deploy

on:
  workflow_run:
    workflows: [backend, frontend]
    branches: [main]
    types: [completed]

permissions:
  id-token: write # required for OIDC federation with AWS, no long-lived keys stored in the repo
  contents: read

jobs:
  deploy-backend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push backend image
        working-directory: backend
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/openhrm-${{ vars.ENVIRONMENT }}-backend:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy new task definition
        run: |
          aws ecs update-service \
            --cluster "openhrm-${{ vars.ENVIRONMENT }}-cluster" \
            --service "openhrm-${{ vars.ENVIRONMENT }}-backend" \
            --force-new-deployment

  deploy-frontend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3 and invalidate CloudFront
        run: |
          aws s3 sync frontend/dist "s3://${{ vars.FRONTEND_BUCKET_NAME }}" --delete
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
