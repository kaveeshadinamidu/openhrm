spring:
  application:
    name: openhrm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/openhrm}
    username: ${DB_USERNAME:openhrm}
    password: ${DB_PASSWORD:openhrm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

openhrm:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
