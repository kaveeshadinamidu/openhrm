services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: openhrm
      POSTGRES_USER: openhrm
      POSTGRES_PASSWORD: openhrm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhrm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/openhrm
      DB_USERNAME: openhrm
      DB_PASSWORD: openhrm
      JWT_SECRET: local-dev-secret-not-for-production-use-only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
